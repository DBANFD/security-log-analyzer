name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned lint tools
        run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Check command-line entry point
        run: python -m security_log_analyzer --help
      - name: Generate isolated native Windows fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/generate_windows_demo.ps1 -OutputDirectory work/native-ci
      - name: Check native EVTX and ETL round trip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:SLA_NATIVE_FIXTURES = (Resolve-Path work/native-ci).Path
          python -m unittest discover -s tests -p test_windows_events.py -v
