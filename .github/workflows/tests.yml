name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Check command-line entry point
        run: python -m security_log_analyzer --help
      - name: Generate isolated native Windows fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/generate_windows_demo.ps1 -OutputDirectory work/native-ci
      - name: Check native EVTX and ETL round trip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:SLA_NATIVE_FIXTURES = (Resolve-Path work/native-ci).Path
          python -m unittest discover -s tests -p test_windows_events.py -v
